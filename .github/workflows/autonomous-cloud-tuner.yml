name: Autonomous Daily Cloud Tuning Engine

on:
  schedule:
    # 4 scheduled runs per day between 17:00 IST and 00:00 IST using non-top-of-hour cron offsets
    - cron: '17 11 * * *'
    - cron: '42 13 * * *'
    - cron: '21 15 * * *'
    - cron: '37 17 * * *'
  workflow_dispatch: # Manual trigger anytime from Actions UI
  issue_comment:
    types: [created]

jobs:
  autonomous-tune-and-commit:
    name: Execute ML Optimization Engine & Telemetry Gate
    # For issue_comment triggers, only run if comment contains '/tune'
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/tune')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify Actor Maintainer Permission
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission' || echo "none")
          echo "Actor permission for ${{ github.actor }}: $PERMISSION"
          if [ "$PERMISSION" != "admin" ] && [ "$PERMISSION" != "write" ]; then
            echo "❌ Actor ${{ github.actor }} does not have maintainer/write permissions. Aborting label/comment command."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Check for Open Tuning PR & Failed PR Threshold (N=3)
        id: check_pr_gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --label "agent-run" --state open --json number -q 'length')
          echo "open_prs_count=$OPEN_PRS" >> $GITHUB_OUTPUT
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "⚠️ An open 'agent-run' PR already exists ($OPEN_PRS open). Skipping new PR creation."
          fi

          # Window the failed PR count to the last 7 days to avoid lifetime accumulation
          SEVEN_DAYS_AGO=$(date -d '7 days ago' -I)
          FAILED_PRS=$(gh pr list --search "label:agent-run is:pr is:closed is:unmerged created:>$SEVEN_DAYS_AGO" --json number -q 'length' || echo "0")
          echo "failed_prs_count=$FAILED_PRS" >> $GITHUB_OUTPUT
          if [ "$FAILED_PRS" -ge 3 ]; then
            echo "🚨 Warning: $FAILED_PRS agent PRs failed or closed unmerged in the last 7 days (Threshold N=3 reached)."
            echo "human_review_required=true" >> $GITHUB_OUTPUT
          else
            echo "human_review_required=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute Measured ML Optimization & Telemetry Benchmark
        run: gradle :ml-tuner:run --args="--mode=measured --duration-sec=30" --no-daemon

      - name: Process Tuning Results & Dual-Path Execution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Locate latest report JSON
          REPORT_FILE=$(find automation/runs -name "*.json" | sort | tail -n 1)
          if [ -z "$REPORT_FILE" ]; then
            echo "❌ No report file produced."
            exit 1
          fi

          STATUS=$(jq -r '.status' "$REPORT_FILE")
          echo "Tuning status: $STATUS"

          # Configure Git identities
          # Note: If GITHUB_TOKEN is a PAT fallback, committer identity is cosmetic Git metadata.
          # Full verified [bot] badges require GitHub App installation tokens.
          git config user.name "DharaneshV"
          git config user.email "dharaneshv@users.noreply.github.com"
          git config committer.name "autonomous-performance-tuner[bot]"
          git config committer.email "autonomous-performance-tuner[bot]@users.noreply.github.com"

          HUMAN_REVIEW="${{ steps.check_pr_gates.outputs.human_review_required }}"
          OPEN_COUNT="${{ steps.check_pr_gates.outputs.open_prs_count }}"

          if [ "$STATUS" = "MEASURED_VERIFIED" ] && [ "$OPEN_COUNT" -eq 0 ] && [ "$HUMAN_REVIEW" != "true" ]; then
            echo "✅ Measured Telemetry Verified! Creating tuning PR..."
            TIMESTAMP=$(date +'%Y%m%d-%H%M')
            BRANCH_NAME="agent/autotune/${TIMESTAMP}"
            
            git checkout -b "$BRANCH_NAME"
            git add deployments/jvm-flags.env "$REPORT_FILE"
            git commit -m "chore(auto-tune): update JVM flags based on measured CI telemetry" -m "Agent-System: Autonomous Performance Tuner"
            git push origin "$BRANCH_NAME"

            PR_URL=$(gh pr create \
              --title "chore(auto-tune): autonomous JVM performance tuning update [$TIMESTAMP]" \
              --body "### 🤖 Autonomous Performance Tuner - Measured Telemetry PR%0A%0AReport: \`$REPORT_FILE\`%0AStatus: \`$STATUS\`%0A%0A> [!NOTE]%0A> \`target-app\` serves as a workload proxy. Tuning recommendations should be treated as candidates for canary/staged rollout." \
              --label "agent-run" \
              --head "$BRANCH_NAME" \
              --base "main")

            echo "PR created: $PR_URL"
            gh pr merge "$PR_URL" --auto --squash || echo "Auto-merge enabled (pending required CI status checks)."

          elif [ "$HUMAN_REVIEW" = "true" ]; then
            echo "🚨 Human review required (N=3 failed PRs threshold reached). Skipping automated PR creation."
            git fetch origin automation-logs || git branch automation-logs
            git checkout automation-logs || git checkout -b automation-logs
            git add "$REPORT_FILE"
            git commit -m "chore(telemetry-log): record run report (human review required - N=3 failed threshold)" -m "Agent-System: Autonomous Performance Tuner" || echo "No changes to commit"
            git push origin automation-logs || echo "Pushed to automation-logs"

          else
            echo "ℹ️ Heartbeat run or unverified status ($STATUS). Writing to automation-logs branch..."
            git fetch origin automation-logs || git branch automation-logs
            git checkout automation-logs || git checkout -b automation-logs
            git add "$REPORT_FILE"
            git commit -m "chore(telemetry-log): record daily performance heartbeat report" -m "Agent-System: Autonomous Performance Tuner" || echo "No changes to commit"
            git push origin automation-logs || echo "Pushed to automation-logs"
          fi
